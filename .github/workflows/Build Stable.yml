name: Build Stable
on:
  watch:
    types: [started]

  workflow_dispatch:

jobs:
  build:
    name: Build KernelSU Stable
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup build kernel environment
      run: |
        sudo apt update
        sudo apt install libc6-dev clang flex bison libssl-dev bc python3 zip unzip git lld llvm
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace
        
    - name: Download Proton-clang
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/kdrag0n/proton-clang.git proton-clang --depth=1
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/proton-clang/bin:$PATH"
        
    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/likkai/ksu_kernel_xiaomi_lisa.git --depth=1
        
    - name: Integrate KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev_susfs

    - name: Integrate susfs
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa
        git clone https://gitlab.com/simonpunk/susfs4ksu.git --depth=1
        cd $GITHUB_WORKSPACE/kernel_workspace/susfs4ksu
        cp ./kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa/KernelSU/
        cp ./kernel_patches/50_add_susfs_in_kernel-5.4.patch $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa
        cp ./kernel_patches/fs/susfs.c $KERNEL_ROOT/fs/ $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa/fs 
        cp ./kernel_patches/include/linux/susfs.h $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa
        cd $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa/KernelSU/ 
        patch -p1 < 10_enable_susfs_for_ksu.patch && patch -p1 < 50_add_susfs_in_kernel-5.4.patch

    - name: Compiling Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/ksu_kernel_xiaomi_lisa
        chmod +x build.sh
        ./build.sh
        filename=$(find . -name Quick* -printf '%f\n')
        echo $filename
        echo "FILENAME=$filename" >> $GITHUB_ENV
        
    - name: Uploading Kernel
      uses: actions/upload-artifact@v4
      with:
        name: QuicksilveR_KernelSU
        path: ${{ github.workspace }}/kernel_workspace/ksu_kernel_xiaomi_lisa/${{ env.FILENAME }}
